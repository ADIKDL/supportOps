[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "supportops-ai-backend"
version = "0.1.0"
description = "SupportOps AI Backend"
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "redis>=5.0",
  "rq>=1.15",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "python-dotenv>=1.0",
  "pyjwt>=2.8",
  "passlib[bcrypt]>=1.7",
  "httpx>=0.26",
  "email-validator>=2.1",
  "pytest>=7.4",
  "ruff>=0.3",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"
